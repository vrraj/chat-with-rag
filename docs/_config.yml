# --- Site Metadata & SEO Defaults ---
title: "Chat with RAG"
tagline: "Advanced RAG system with multi-provider LLM support"
description: "Retrieval-Augmented Generation system with streaming capabilities, multi-provider support, and comprehensive API documentation."
url: "https://vrraj.github.io"
baseurl: "/chat-with-rag"

# --- Theme Configuration ---
theme: jekyll-theme-cayman
show_downloads: true

# --- Plugins ---
plugins:
  - jekyll-seo-tag
  - jekyll-gist

# --- Google Analytics (GA4) ---
google_analytics: G-KBYFPBJ1MG

# --- SEO Specifics ---
# GitHub profile: vrraj/chat-with-rag

# --- Build Settings ---
markdown: kramdown
highlighter: rouge
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

# --- Defaults for SEO and navigation ---
defaults:
  - scope:
      path: "" # Applies to all files
    values:
      layout: "default"

  - scope:
      path: "index.md"
    values:
      title: "Chat with RAG: Advanced RAG System"
      description: "Modular tool-assisted Retrieval-Augmented Generation (RAG) framework with multi-LLM orchestration, configurable pipelines, smart ingestion, and embeddable AI chat interfaces."

  - scope:
      path: "api-reference.md"
    values:
      title: "API Reference | Chat with RAG"
      description: "Complete REST API reference for Chat with RAG including chat endpoints, ingestion APIs, pipeline parameters, request and response schemas, and session-based workflows."

  - scope:
      path: "embedded-chat.md"
    values:
      title: "Embedded Chat Guide | Chat with RAG"
      description: "Guide to embedding the Chat with RAG assistant into websites using iframe or loader scripts, with configuration options for retrieval, prompts, and pipeline behavior."

  - scope:
      path: "server-sent-events.md"
    values:
      title: "Server-Sent Events | Chat with RAG"
      description: "Server-Sent Events for real-time observability of the RAG pipeline, exposing retrieval, inference, and tool execution stages."

  - scope:
      path: "technical-overview.md"
    values:
      title: "Technical Overview | Chat with RAG"
      description: "Deep technical overview of the Chat with RAG architecture including ingestion pipelines, orchestration flow, vector indexing, context management, and multi-LLM integration."

  - scope:
      path: "attributions.md"
    values:
      title: "Attributions | Chat with RAG"
      description: "Licensing details and attribution for third-party components, datasets, and resources used in the Chat with RAG project."
