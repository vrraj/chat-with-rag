<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Embedding Config Editor</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-6">
    <div class="bg-white rounded-lg shadow p-4 mb-4">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 class="text-2xl font-semibold text-gray-900">Domain Embedding Config Editor</h1>
          <p id="registryMeta" class="text-sm text-gray-600 mt-1">Loading config...</p>
        </div>
        <div class="flex gap-2">
          <button id="reloadBtn" class="px-3 py-2 rounded bg-gray-200 text-gray-800 hover:bg-gray-300">Reload</button>
          <button id="saveBtn" class="px-3 py-2 rounded bg-indigo-600 text-white hover:bg-indigo-700">Save Changes</button>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow p-4 mb-4">
      <p class="text-sm text-gray-700">
        Edit the JSON object under <code>domains</code>. Validation is enforced on save for
        <code>model_type</code>, <code>vector_type</code>, and <code>search_mode</code>.
      </p>
      <div class="mt-3 flex items-center gap-2 flex-wrap">
        <label for="activeDomainSelect" class="text-sm font-medium text-gray-700">Active Domain</label>
        <select id="activeDomainSelect" class="rounded border-gray-300 text-sm"></select>
        <button id="applyActiveDomainBtn" class="px-3 py-1 rounded bg-blue-600 text-white hover:bg-blue-700 text-sm">Apply</button>
      </div>
      <p id="activeDomainMeta" class="text-xs text-gray-500 mt-2"></p>
    </div>

    <div class="bg-white rounded-lg shadow p-4 mb-4">
      <label for="editor" class="block text-sm font-medium text-gray-700 mb-2">Registry JSON</label>
      <textarea id="editor" rows="45" class="w-full rounded border-gray-300 text-sm font-mono p-3"></textarea>
    </div>

    <div id="status" class="text-sm"></div>
  </div>

  <script src="/static/domain-embedding-config.js"></script>
</body>
</html>
