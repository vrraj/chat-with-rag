<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Chat • UI Shell</title>
    <!-- Use local static assets; no external CDNs -->
    <link rel="stylesheet" href="static/chat.css" />
  </head>
  <body>
    <!-- App layout: sidebar (controls), main (metrics + history + input) -->
    <div id="app">
      <aside id="sidebar" aria-label="Parameters Sidebar">
        <h2 class="section-title">Parameters</h2>
        <form id="params_form" autocomplete="off">
          <!-- Vector search -->
          <div class="field-group">
            <label for="top_k">Top K</label>
            <input id="top_k" type="number" min="1" step="1" value="5" />
          </div>
          <div class="field-group">
            <label for="score_threshold">Score Threshold</label>
            <input id="score_threshold" type="number" min="0" max="1" step="0.01" value="0.20" />
          </div>

          <!-- Inference -->
          <div class="field-group">
            <label for="temperature">Temperature</label>
            <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7" />
          </div>
          <div class="field-group">
            <label for="top_p">Top P</label>
            <input id="top_p" type="number" min="0" max="1" step="0.01" value="1.0" />
          </div>
          <div class="field-group">
            <label for="max_output_tokens">Max Output Tokens</label>
            <input id="max_output_tokens" type="number" min="1" step="1" value="512" />
          </div>
          <div class="field-group">
            <label for="presence_penalty">Presence Penalty</label>
            <input id="presence_penalty" type="number" min="-2" max="2" step="0.1" value="0.0" />
          </div>
          <div class="field-group">
            <label for="frequency_penalty">Frequency Penalty</label>
            <input id="frequency_penalty" type="number" min="-2" max="2" step="0.1" value="0.0" />
          </div>
          <div class="field-group">
            <button id="clear_chat_btn" type="button" title="Clear chat">Clear chat</button>
          </div>
          <!-- Note: Controls are inert in this phase (no backend). -->
        </form>
      </aside>

      <main id="main" aria-label="Chat Area">
        <!-- Read-only metrics (placeholders only) -->
        <section id="metrics_bar" aria-label="Metrics">
          <div class="metric"><span class="metric-label">Prompt Tokens</span><span id="prompt_tokens" class="metric-value">—</span></div>
          <div class="metric"><span class="metric-label">Completion Tokens</span><span id="completion_tokens" class="metric-value">—</span></div>
          <div class="metric"><span class="metric-label">Total Tokens</span><span id="total_tokens" class="metric-value">—</span></div>
          <div class="metric sep"></div>
          <div class="metric"><span class="metric-label">Prompt Cost</span><span id="prompt_cost" class="metric-value">—</span></div>
          <div class="metric"><span class="metric-label">Completion Cost</span><span id="completion_cost" class="metric-value">—</span></div>
          <div class="metric"><span class="metric-label">Total Cost</span><span id="total_cost" class="metric-value">—</span></div>
          <div class="metric"><span class="metric-label">Rerank Tokens</span><span id="rerank_tokens" class="metric-value">—</span></div>
          <div class="metric"><span class="metric-label">Rerank Cost</span><span id="rerank_cost" class="metric-value">—</span></div>
        </section>

        <!-- Scrollable chat history -->
        <section id="chat_history" role="log" aria-live="polite" aria-label="Chat History"></section>

        <!-- Input bar -->
        <section id="input_bar" aria-label="Message Input">
          <textarea id="chat_input" rows="1" placeholder="Type a message..." spellcheck="true"></textarea>
          <button id="send_button" type="button" title="Send (Enter)">Send</button>
        </section>
      </main>
    </div>

    <script src="static/chat.js"></script>
  </body>
  </html>
