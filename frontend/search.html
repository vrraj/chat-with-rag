<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Chat Agent - Search</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <link href="/static/search.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8">Website Chat Agent - Search</h1>

        <!-- Navigation -->
        <div class="flex justify-center mb-8">
            <a href="/" class="px-4 py-2 rounded-md text-gray-700 hover:text-gray-900">
                Back to Main
            </a>
        </div>

        <!-- Search Section -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-semibold mb-4">Search Content</h2>
            
            <!-- Search Form -->
            <form id="searchForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Search Query</label>
                    <input type="text" id="searchQuery" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Enter your search query">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Limit Results</label>
                    <input type="number" id="searchLimit" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" value="5" min="1" max="50">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Filter by URL (optional)</label>
                    <input type="text" id="searchUrlFilter" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Filter by specific URL">
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Score Threshold (0-1)</label>
                        <input type="number" id="scoreThreshold" step="0.05" min="0" max="1" value="0.35" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Exact Match</label>
                        <select id="exactMatch" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Include Payload</label>
                        <select id="withPayload" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Search
                </button>
            </form>

            <!-- Results Container -->
            <div id="searchResults" class="mt-6 space-y-4">
                <!-- Results will be inserted here -->
            </div>
        </div>
    </div>

    <script src="/static/search.js"></script>
</body>
</html>
