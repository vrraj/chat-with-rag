<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embedded Chat</title>
    <link rel="stylesheet" href="static/chat.css" />
    <style>
      /* Constrain scrolling to the chat history inside the iframe */
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden; /* prevent page scroll so footer/input stay fixed */
      }
      /* Layout tweaks scoped to embed IDs to avoid affecting main chat */
      #embed_app {
        height: 100%;
        box-sizing: border-box;
        padding: 12px;
        display: flex;
        flex-direction: column;
      }
      #embed_main {
        flex: 1;
        min-height: 0; /* allow inner flex child to shrink and scroll */
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #embed_chat_history {
        flex: 1;
        min-height: 0; /* critical for scroll within flex container */
        overflow-y: auto;
        padding: 8px;
      }
      #embed_input_bar {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
      }
      #embed_chat_input {
        width: 100%;
        box-sizing: border-box;
        resize: none; /* we handle height via JS */
        min-height: 40px;
        max-height: 160px;
        padding: 8px 10px;
      }
      #embed_send_button {
        align-self: flex-end;
      }
      /* Ensure message bubbles wrap inside the frame */
      #embed_chat_history .bubble {
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* Assistant/user alignment and width within embed-only history */
      #embed_chat_history .msg {
        max-width: var(--embed-assistant-max-width, 75%);
      }
      #embed_chat_history .msg.user {
        margin-left: auto;
      }
      #embed_chat_history .msg.assistant {
        margin-right: auto;
      }
      #embed_chat_history .msg.assistant .bubble {
        background: none;
        border: none;
        padding-left: 0;
        padding-right: 0;
      }
      #embed_footer {
        padding-top: 4px;
        font-size: 11px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="embed_app">
      <main id="embed_main" aria-label="Embedded Chat Area">
        <section id="embed_chat_history" role="log" aria-live="polite" aria-label="Chat History"></section>
        <section id="embed_input_bar" aria-label="Message Input">
          <textarea id="embed_chat_input" rows="1" placeholder="Type a message..." spellcheck="true"></textarea>
          <button id="embed_send_button" type="button" title="Send (Enter)">Send</button>
        </section>
      </main>

      <footer id="embed_footer" aria-label="Embed Attribution">
        <small>Powered by this RAG chat service.</small>
      </footer>
    </div>

    <script src="static/chat-embed.js"></script>
  </body>
</html>
