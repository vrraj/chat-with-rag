<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debug Index Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">Debug Index</h1>
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700">Filter by URL (optional)</label>
          <input id="debugUrl" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="https://example.com/path" />
        </div>
        <div class="flex items-end">
          <button id="fetchDebugBtn" class="px-4 py-2 rounded-md text-white bg-indigo-600 hover:bg-indigo-700">Fetch</button>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Results</h2>
        <button id="downloadBtn" class="px-4 py-2 rounded-md text-white bg-green-600 hover:bg-green-700" disabled>Download JSON</button>
      </div>
      <pre id="debugOutput" class="bg-gray-50 p-4 rounded overflow-auto h-96 text-sm"></pre>
    </div>
  </div>

  <script>
    const fetchBtn = document.getElementById('fetchDebugBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const input = document.getElementById('debugUrl');
    const output = document.getElementById('debugOutput');
    let lastJson = null;

    async function fetchDebug() {
      try {
        const url = (input.value || '').trim();
        const qs = url ? `?url=${encodeURIComponent(url)}` : '';
        const resp = await fetch(`/debug-index${qs}`);
        const data = await resp.json();
        lastJson = data;
        output.textContent = JSON.stringify(data, null, 2);
        downloadBtn.disabled = false;
      } catch (e) {
        output.textContent = `Error: ${e}`;
        downloadBtn.disabled = true;
      }
    }

    function downloadJson() {
      if (!lastJson) return;
      const blob = new Blob([JSON.stringify(lastJson, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'debug-index.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    fetchBtn.addEventListener('click', fetchDebug);
    downloadBtn.addEventListener('click', downloadJson);
  </script>
</body>
</html>
