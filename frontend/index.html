<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Chat Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8">Website Chat Agent</h1>
        
        <!-- URL Input Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4">Index Content</h2>
            <div id="urlList" class="space-y-4 mb-4">
                <!-- URLs will be added here dynamically -->
            </div>
            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700">Add URL</label>
                    <input type="text" id="newUrl" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Document Type</label>
                    <select id="docType" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="HTML">HTML</option>
                        <option value="PDF">PDF</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Max chunks</label>
                    <input type="number" id="maxChunksInput" value="0" min="0" class="mt-1 w-28 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    <p class="text-xs text-gray-500 mt-1">0 = no user limit</p>
                </div>
                <button id="addUrlBtn" class="mt-5 px-4 py-2 rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
                    Add URL
                </button>
            </div>
            <div class="flex items-center justify-between mt-4">
                <label class="inline-flex items-center">
                    <input type="checkbox" id="estimateToggle" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                    <span class="ml-2 text-sm text-gray-700">Estimate only (no indexing)</span>
                </label>
            </div>
            <button id="indexBtn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Index Content
            </button>
        </div>

        <!-- PDF Input Section (URL or Upload) -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4">Index PDF (URL or Upload)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">PDF URL</label>
                    <input type="text" id="pdfUrl" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="https://example.com/file.pdf">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Or upload PDF</label>
                    <input type="file" id="pdfFile" accept="application/pdf" class="mt-1 block w-full text-sm text-gray-700" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Max chunks</label>
                    <input type="number" id="pdfMaxChunks" value="0" min="0" class="mt-1 w-28 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    <p class="text-xs text-gray-500 mt-1">0 = no user limit</p>
                </div>
                <div class="flex items-end">
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="pdfEstimateToggle" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-2 text-sm text-gray-700">Estimate only (no indexing)</span>
                    </label>
                </div>
            </div>
            <div class="flex items-center justify-between mt-4">
                <label class="inline-flex items-center">
                    <input type="checkbox" id="pdfForceDelete" checked class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                    <span class="ml-2 text-sm text-gray-700">Force delete existing</span>
                </label>
                <button id="pdfIndexBtn" class="px-4 py-2 rounded-md text-white bg-indigo-600 hover:bg-indigo-700">Index PDF</button>
            </div>
            <div id="pdfProgress" class="text-sm text-gray-600 mt-2"></div>
        </div>

        <!-- MediaWiki Index Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4">Index MediaWiki Page (e.g., Wikipedia)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">MediaWiki URL</label>
                    <input type="text" id="mwUrl" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="https://en.wikipedia.org/wiki/OpenAI">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Max chunks</label>
                    <input type="number" id="mwMaxChunks" value="0" min="0" class="mt-1 w-28 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    <p class="text-xs text-gray-500 mt-1">0 = no user limit</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Skip sections (comma-separated)</label>
                    <input type="text" id="mwSkipSections" value="References, External Links, Further reading, Notes" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">API URL (optional)</label>
                    <input type="text" id="mwApiUrl" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="https://en.wikipedia.org/w/api.php">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">User-Agent (optional)</label>
                    <input type="text" id="mwUA" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="WebsiteChatAgent/0.1 (contact@example.com)">
                </div>
                <div class="flex items-end">
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="mwEstimateToggle" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-2 text-sm text-gray-700">Estimate only (no indexing)</span>
                    </label>
                </div>
            </div>
            <div class="flex items-center justify-between mt-4">
                <label class="inline-flex items-center">
                    <input type="checkbox" id="mwForceDelete" checked class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                    <span class="ml-2 text-sm text-gray-700">Force delete existing</span>
                </label>
                <button id="mwIndexBtn" class="px-4 py-2 rounded-md text-white bg-indigo-600 hover:bg-indigo-700">Index MediaWiki</button>
            </div>
            <div id="mwProgress" class="text-sm text-gray-600 mt-2"></div>
        </div>

        <!-- HTML Index Section (single URL) -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4">Index HTML Page</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Page URL</label>
                    <input type="text" id="htmlUrl" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="https://example.com/page">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Max chunks</label>
                    <input type="number" id="htmlMaxChunks" value="0" min="0" class="mt-1 w-28 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    <p class="text-xs text-gray-500 mt-1">0 = no user limit</p>
                </div>
                <div class="flex items-end">
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="htmlEstimateToggle" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-2 text-sm text-gray-700">Estimate only (no indexing)</span>
                    </label>
                </div>
            </div>
            <div class="flex items-center justify-between mt-4">
                <label class="inline-flex items-center">
                    <input type="checkbox" id="htmlForceDelete" checked class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                    <span class="ml-2 text-sm text-gray-700">Force delete existing</span>
                </label>
                <button id="htmlIndexBtn" class="px-4 py-2 rounded-md text-white bg-indigo-600 hover:bg-indigo-700">Index HTML</button>
            </div>
            <div id="htmlProgress" class="text-sm text-gray-600 mt-2"></div>
        </div>

        <!-- Shortcuts Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4">Quick Links</h2>
            <div class="flex gap-4">
                <button id="openSearchBtn" class="px-4 py-2 rounded-md text-white bg-green-600 hover:bg-green-700">Open Search</button>
                <button id="openDebugBtn" class="px-4 py-2 rounded-md text-white bg-yellow-600 hover:bg-yellow-700">Open Debug Index</button>
                <a href="/chat.html" target="_blank" class="px-4 py-2 rounded-md text-white bg-blue-600 hover:bg-blue-700">Open Chat</a>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
