# Non-hosted (local) retrieval models configuration
# Used when model_type is "local" in DOMAIN_EMBEDDING_CONFIG

models:
  # TIER 1: DENSE (Semantic Vibes)
  dense:
    name: "BAAI/bge-base-en-v1.5"
    dimensions: 768
    distance: "Cosine"
    cache_dir: "~/models/fastembed_cache"

  # TIER 1: SPARSE (Lexical/Keyword matching)
  sparse:
    name: "prithivida/Splade_PP_en_v1"
    # Dimensions for sparse are dynamic (vocab size ~30522)
    cache_dir: "~/models/fastembed_cache"
  
  # TIER 2: LATE INTERACTION (Token-level precision for symbols/code)
  late_interaction:
    enabled: false
    name: "colbert-ir/colbertv2.0"
    dimensions: 128  # ColBERT uses 128-dim embeddings PER token
    max_length: 512
    cache_dir: "~/models/fastembed_cache"

  # TIER 3: RERANKER (Cross-Encoder for re-ranking)
  reranker:
    enabled: true
    name: "BAAI/bge-reranker-base"
    cache_dir: "~/models/fastembed_cache"
