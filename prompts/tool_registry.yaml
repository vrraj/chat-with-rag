version: 1
artifact_injection:
  enabled: true
  allowed_tools:
    - get_timeseries_sparklines_svg
  security:
    max_artifact_chars: 120000
    allowed_artifact_types:
      - svg
    allowed_injection_modes:
      - verbatim
    enforce_placeholder_format: true
tools:
  - name: get_weather
    enabled: true
    artifact:
      produces_artifact: false
      artifact_type: ""
      artifact_key: ""
      injection_mode: ""
      placeholder: ""

  - name: web_search
    enabled: true
    artifact:
      produces_artifact: false
      artifact_type: ""
      artifact_key: ""
      injection_mode: ""
      placeholder: ""

  - name: get_nearby_airports
    enabled: true
    artifact:
      produces_artifact: false
      artifact_type: ""
      artifact_key: ""
      injection_mode: ""
      placeholder: ""

  - name: get_timeseries_sparklines_svg
    enabled: true
    artifact:
      produces_artifact: true
      artifact_type: svg
      artifact_key: svg
      injection_mode: verbatim
      placeholder: "{{ARTIFACT:chart_svg}}"
