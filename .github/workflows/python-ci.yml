name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (compile project Python files)
        run: |
          python -m compileall backend scripts scripts/qdrant_scripts

      - name: Check YAML syntax
        run: |
          python -c "import yaml; yaml.safe_load(open('prompts/prompt_registry.yaml'))"
          python -c "import yaml; yaml.safe_load(open('docs/_config.yml'))"

      - name: Validate documentation links
        run: |
          find docs -name "*.md" -exec grep -l "\[.*\](.*\.md)" {} \;
