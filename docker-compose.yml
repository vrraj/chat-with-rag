services:
  # 1. Qdrant Vector Database Service
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: qdrant-server
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # Rotate after 10MB
        max-file: "3"    # Keep 3 log files
        compress: "true" # Compress rotated logs
    ports:
      - "6333:6333" # REST API (for external clients)
      - "6334:6334" # gRPC API
    volumes:
      # Persistent storage for Qdrant data (CRITICAL!)
      - ./qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'timeout 5 bash -c \"</dev/tcp/127.0.0.1/6333\"' || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6

  # 2. Uvicorn Web Application Service
  webapp:
    build: . # Build the image using the local Dockerfile
    container_name: uvicorn-app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # Rotate after 10MB
        max-file: "3"    # Keep 3 log files
        compress: "true" # Compress rotated logs
        tag: "{{.Name}}/{{.ID}}"  # Add container name and ID to logs
    ports:
      - "8000:8000" # Expose your Uvicorn port (Host:Container)
    command: python run.py # *** USES THE DEVELOPMENT SCRIPT run.py  with reload option in uvicorn***
    # command: python start.py # *** USES THE PRODUCTION SCRIPT start.py ***

   # docker-compose should read .env file automatically if it exists
   # env_file:
   #   - .env

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Use the service name 'qdrant' for connection inside the Docker network
      QDRANT_HOST: qdrant 
      QDRANT_PORT: 6333

    volumes:
      # Persistent storage for logs written by your start.py script
      - ./logs:/app/logs
      # Bind mount - map host project root to the working directory in the container
      - .:/app

    depends_on:
      qdrant:
        condition: service_healthy
